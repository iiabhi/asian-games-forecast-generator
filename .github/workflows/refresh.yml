name: refresh-data

# Calls the site's /api/refresh endpoint to pull fresh medals (Wikipedia) and news (Google News).
# Needs two repository secrets: SITE_URL (e.g. https://your-site.vercel.app, no trailing slash) and REFRESH_TOKEN.
on:
  # Games finished (2026-10-03): the 20-minute schedule is switched off. Restore it to resume auto refresh:
  # schedule:
  #   - cron: "*/20 * * * *" # every 20 minutes (GitHub may start it a few minutes late)
  workflow_dispatch: # lets you run it by hand from the Actions tab

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/refresh
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          test -n "$SITE_URL" && test -n "$REFRESH_TOKEN" || { echo "Missing SITE_URL or REFRESH_TOKEN secret"; exit 1; }
          curl -sS --fail-with-body --max-time 120 \
            -H "Authorization: Bearer $REFRESH_TOKEN" \
            "$SITE_URL/api/refresh"
